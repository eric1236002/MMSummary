## 這份 Nginx 設定用來部署前端 SPA，並把 `/api/` 請求反向代理到後端服務。
## 主要用途：
## - 提供 React build 後的靜態檔案
## - 支援前端路由直接刷新不 404
## - 將 API 請求轉送到後端，方便前後端同站部署
server {
    listen 80;
    server_name localhost;

    location / {
        # 前端是單頁應用（SPA），所以所有非 API 路徑都回到 index.html，
        # 讓 React Router 可以在瀏覽器端接手路由。
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 將 /api/ 的請求轉發到後端服務，讓前後端可以同域名部署而不需要額外處理 CORS。
    location /api/ {
        proxy_pass http://backend-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 摘要任務可能較久，因此把 timeout 拉長，避免長時間請求被 Nginx 提前切斷。
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

