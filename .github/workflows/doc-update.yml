name: Docs Sync Check

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main, doc-update]
    paths-ignore:
      - ".github/docs-sync-needed/**"
  pull_request:
    branches: [main, doc-update]
    types: [closed]
    paths-ignore:
      - ".github/docs-sync-needed/**"

jobs:
  check-doc-sync:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            TARGET_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            TARGET_SHA="${{ github.sha }}"
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              git diff-tree --no-commit-id --name-only -r "$TARGET_SHA" > /tmp/changed_files.txt
              {
                echo "changed_files<<EOF"
                cat /tmp/changed_files.txt
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git diff --name-only "$BASE_SHA" "$TARGET_SHA" > /tmp/changed_files.txt
          {
            echo "changed_files<<EOF"
            cat /tmp/changed_files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate docs sync requirement
        id: evaluate
        run: |
          set -euo pipefail

          CODE_CHANGED=false
          DOCS_CHANGED=false
          > /tmp/filtered_code_files.txt

          while IFS= read -r file || [ -n "$file" ]; do
            [ -z "$file" ] && continue

            case "$file" in
              README.md|README_ZH.md|k8s/README.md)
                DOCS_CHANGED=true
                ;;
              .github/docs-sync-needed/*)
                ;;
              *)
                CODE_CHANGED=true
                echo "$file" >> /tmp/filtered_code_files.txt
                ;;
            esac
          done < /tmp/changed_files.txt

          NEEDS_PR=false
          if [ "$CODE_CHANGED" = true ] && [ "$DOCS_CHANGED" = false ]; then
            NEEDS_PR=true
          fi

          echo "code_changed=$CODE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$DOCS_CHANGED" >> "$GITHUB_OUTPUT"
          echo "needs_pr=$NEEDS_PR" >> "$GITHUB_OUTPUT"
          {
            echo "filtered_code_files<<EOF"
            cat /tmp/filtered_code_files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create docs-sync reminder file
        if: steps.evaluate.outputs.needs_pr == 'true'
        run: |
          set -euo pipefail
          mkdir -p .github/docs-sync-needed
          {
            echo "# Documentation Sync Required"
            echo
            echo "A code change was detected without updates to:"
            echo "- README.md"
            echo "- README_ZH.md"
            echo "- k8s/README.md"
            echo
            echo "Commit: ${{ github.sha }}"
            echo "Event: ${{ github.event_name }}"
            echo
            echo "## Changed non-doc files"
            echo '```'
            printf '%s\n' "${{ steps.evaluate.outputs.filtered_code_files }}"
            echo '```'
          } > ".github/docs-sync-needed/${{ github.sha }}.md"
          git add .github/docs-sync-needed/${{ github.sha }}.md

      - name: Open PR for documentation sync
        if: steps.evaluate.outputs.needs_pr == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: add sync reminder for ${{ github.sha }}"
          title: "docs: sync README files for ${{ github.sha }}"
          body: |
            This PR was created automatically because code changes were detected
            without updates to the following docs:
            - `README.md`
            - `README_ZH.md`
            - `k8s/README.md`

            Please update the related documentation and merge.
          branch: "chore/docs-sync-${{ github.run_id }}"
          delete-branch: true
          token: ${{ secrets.GH_PAT }}
          add-paths: |
            .github/docs-sync-needed/*.md