apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: mmsummary
spec:
  # MongoDB 只需要讓叢集內部的後端存取，所以用 ClusterIP 即可。
  # 這樣外部不會直接暴露資料庫，安全性較高。
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: mmsummary
spec:
  # Backend 主要提供給 Ingress 轉發 /api 請求使用，因此也用 ClusterIP。
  # 這代表只有叢集內部可以直接連到這個 Service。
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: mmsummary
spec:
  # Frontend 需要對外提供瀏覽器訪問，因此這裡使用 LoadBalancer。
  # 實際上若有 Ingress，也可以改成 ClusterIP 再由 Ingress 統一對外。
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer

