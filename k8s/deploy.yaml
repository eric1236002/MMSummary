## 這份部署檔負責建立 MMSummary 在 Kubernetes 上運行所需的核心資源。
## 這裡把「共用設定、資料儲存、後端、前端」集中放在同一份檔案，
## 方便一次建立整個應用需要的基礎設施，也比較容易維護彼此之間的依賴。
##
## 資源順序大致代表依賴關係：
## 1. Namespace：先建立隔離環境
## 2. ConfigMap / PVC：提供設定與持久化儲存
## 3. MongoDB：先讓資料層可用
## 4. Backend：再讓 API 服務能連資料庫與 LLM provider
## 5. Frontend：最後提供使用者介面

apiVersion: v1
kind: Namespace
metadata:
  # Namespace 的作用是將所有 MMSummary 相關資源隔離開來。
  # 這樣做可以避免不同專案的 Deployment / Service / Secret 互相干擾，
  # 也讓 kubectl 的管理範圍更清楚。
  name: mmsummary
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mmsummary-config
  namespace: mmsummary
data:
  # ConfigMap 放的是「非敏感」設定，例如服務網址。
  # 這些值可以被多個 Pod 共用，避免寫死在 image 或程式碼裡。
  MONGODB_URL: "mongodb://mongodb-service:27017"
  BACKEND_URL: "http://backend-service:8000"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: mmsummary
spec:
  # PVC 用來向 Kubernetes 要一塊持久化空間，專門給 MongoDB 存資料。
  # 如果只用容器內部檔案系統，Pod 一重建資料就會消失。
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  namespace: mmsummary
spec:
  # MongoDB 這裡先用單副本即可，因為主要目的是提供應用的歷史紀錄儲存。
  # 若未來需要高可用，可以再升級成 StatefulSet 或加入 replication。
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
        env:
        # MongoDB 啟動時順便建立預設資料庫名稱。
        # 這讓後端第一次連線時就能直接使用 mmsummary 這個資料庫名稱。
        - name: MONGO_INITDB_DATABASE
          value: "mmsummary"
        volumeMounts:
        # 把 MongoDB 的資料目錄掛到 PVC，確保資料能跨 Pod 重建保留。
        - name: mongodb-storage
          mountPath: /data/db
      volumes:
      - name: mongodb-storage
        persistentVolumeClaim:
          claimName: mongodb-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: mmsummary
spec:
  # Backend 負責提供 FastAPI API、呼叫摘要流程、以及寫入歷史紀錄。
  # 先用單副本是最簡單的部署方式，適合目前這種有狀態資料庫但不複雜的服務。
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: ghcr-auth
      containers:
      - name: mmsummary-backend
        image: ghcr.io/eric1236002/mmsummary-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        # 敏感資訊（API key / DB URL）用 Secret 注入，不直接寫在 manifest 裡。
        # 這樣做比較安全，也方便在不同環境切換不同憑證。
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: mmsummary-secrets
              key: OPENAI_API_KEY
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: mmsummary-secrets
              key: OPENROUTER_API_KEY
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: mmsummary-secrets
              key: MONGODB_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: mmsummary
spec:
  # Frontend 是打包後的靜態網站，通常由 Nginx 對外提供。
  # 這裡只需要一個小型容器來服務 HTML/CSS/JS 檔案即可。
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      # 前端 image 一樣從私有 registry 下載，所以也要加上拉取認證。
      - name: ghcr-auth
      containers:
      - name: mmsummary-frontend
        image: ghcr.io/eric1236002/mmsummary-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        volumeMounts:
        # 把自訂 nginx.conf 掛進容器。
        # 這份設定會處理 SPA 路由（刷新不 404）以及 /api 的反向代理。
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-conf
        configMap:
          # 這個 ConfigMap 會包含 nginx.conf 內容，供前端容器直接掛載使用。
          name: nginx-config

